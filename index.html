<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Entrar · Capacity & Delivery Forecast</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23176c47'/%3E%3C/svg%3E"><style>:root{--ink:#17211b;--muted:#68736c;--paper:#f4f7f3;--line:#dce3dd;--blue:#326ed3;--green:#176c47}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;flex-direction:column;font:16px Arial,sans-serif;color:var(--ink);background:var(--paper)}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:3px solid #326ed3;outline-offset:3px}header{min-height:82px;padding:18px 4vw;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center}.brand{font-weight:700;font-size:20px;letter-spacing:.14em;color:#1A2D6D}main{flex:1;display:grid;place-items:center;padding:32px 16px}.card{width:min(420px,100%);background:white;border:1px solid var(--line);border-radius:12px;padding:30px}.eyebrow{letter-spacing:.16em;color:var(--green);font-size:13px;font-weight:bold;margin:0}h1{font-size:30px;letter-spacing:-.04em;margin:8px 0 8px}h1 em{font-family:Georgia,serif;font-weight:normal;color:#274785}.lead{color:var(--muted);margin:0 0 22px;font-size:15px;line-height:1.5}form{display:grid;gap:15px}label{display:grid;gap:7px;font-size:14px}input{padding:11px 12px;border:1px solid var(--line);border-radius:7px;background:white;width:100%}input[aria-invalid=true]{border-color:#b5482f}.primary{border:1px solid var(--ink);border-radius:8px;padding:11px 15px;background:var(--ink);color:white}.primary:disabled{opacity:.6;cursor:wait}.links{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:18px;font-size:14px}.link{border:0;background:none;padding:0;color:var(--blue);text-decoration:underline}#message:not(:empty){padding:12px 15px;border-radius:8px;margin-bottom:16px;line-height:1.5;font-size:14px;background:#fff3df;border:1px solid #edcf98;color:#6d4d1f}#message.ok{background:#e3f1e8;border-color:#a9d3b7;color:#155c3d}small.hint{font-size:12px;color:var(--muted)}[hidden]{display:none!important}</style></head>
<body><header><div class="brand">SEIDOR</div></header>
<main><section class="card"><p class="eyebrow">ACESSO RESTRITO</p><h1>Capacity & <em>Delivery Forecast</em></h1><p class="lead" id="lead">Entre com seu e-mail corporativo <b>@seidor.com</b>.</p>
<div id="message" role="status" aria-live="polite"></div>
<form id="authForm" novalidate>
<label id="nameField" hidden>Nome<input id="name" autocomplete="name"></label>
<label id="emailField">E-mail corporativo<input id="email" type="email" autocomplete="username" placeholder="nome.sobrenome@seidor.com" required><small class="hint">Apenas endereços @seidor.com são aceitos.</small></label>
<label id="passwordField">Senha<input id="password" type="password" autocomplete="current-password" required minlength="8"></label>
<button class="primary" id="submit" type="submit">Entrar</button>
</form>
<div class="links" id="links"><button class="link" type="button" id="toggleMode">Criar conta</button><button class="link" type="button" id="forgot">Esqueci minha senha</button></div>
</section></main>
<script type="module">
import {login,signup,logout,getUser,refreshSession,handleAuthCallback,requestPasswordRecovery,updateUser,acceptInvite,AuthError,MissingIdentityError} from 'https://esm.sh/@netlify/identity@2.0.0'

const ALLOWED_DOMAIN=/^[^@\s]+@seidor\.com$/i
const $=id=>document.getElementById(id)
const params=new URLSearchParams(location.search)
const next=(p=>p&&p.startsWith('/')&&!p.startsWith('//')&&!p.startsWith('/login')?p:'/')(params.get('next'))
let mode='login',inviteToken=null

const show=(text,ok=false)=>{$('message').textContent=text;$('message').className=ok?'ok':''}
const goNext=()=>{sessionStorage.setItem('authRedirectAt',Date.now());location.replace(next)}

function setMode(m){
 mode=m
 const cfg={
  login:{btn:'Entrar',lead:'Entre com seu e-mail corporativo <b>@seidor.com</b>.',name:false,email:true,pass:true,links:true,toggle:'Criar conta'},
  signup:{btn:'Criar conta',lead:'Crie sua conta com o e-mail corporativo <b>@seidor.com</b>.',name:true,email:true,pass:true,links:true,toggle:'Já tenho conta'},
  forgot:{btn:'Enviar link de redefinição',lead:'Informe seu e-mail <b>@seidor.com</b> para redefinir a senha.',name:false,email:true,pass:false,links:true,toggle:'Voltar ao login'},
  reset:{btn:'Salvar nova senha',lead:'Defina uma nova senha para sua conta.',name:false,email:false,pass:true,links:false},
  invite:{btn:'Ativar conta',lead:'Defina uma senha para ativar seu convite.',name:false,email:false,pass:true,links:false}
 }[m]
 $('submit').textContent=cfg.btn;$('lead').innerHTML=cfg.lead
 $('nameField').hidden=!cfg.name;$('emailField').hidden=!cfg.email;$('passwordField').hidden=!cfg.pass;$('links').hidden=!cfg.links
 $('forgot').hidden=m!=='login';$('toggleMode').textContent=cfg.toggle||''
 $('password').autocomplete=m==='login'?'current-password':'new-password'
}

function validEmail(){
 const email=$('email').value.trim()
 const ok=ALLOWED_DOMAIN.test(email)
 $('email').setAttribute('aria-invalid',String(!ok))
 if(!ok)show('Acesso permitido somente para e-mails do domínio @seidor.com (ex.: leandro.goncalves@seidor.com).')
 return ok?email:null
}

function authMessage(error){
 if(error instanceof MissingIdentityError)return 'O login não está disponível no momento. Tente novamente mais tarde.'
 if(error instanceof AuthError){
  if(error.status===401)return mode==='signup'?'Cadastro não autorizado. Use um e-mail @seidor.com.':'E-mail ou senha inválidos, ou e-mail ainda não confirmado.'
  if(error.status===403)return 'Cadastros estão desativados. Solicite um convite ao administrador.'
  if(error.status===422)return 'Dados inválidos. A senha precisa ter pelo menos 8 caracteres.'
  return error.message
 }
 return 'Não foi possível concluir. Tente novamente.'
}

$('toggleMode').onclick=()=>{show('');setMode(mode==='login'?'signup':'login')}
$('forgot').onclick=()=>{show('');setMode('forgot')}

$('authForm').onsubmit=async e=>{
 e.preventDefault();show('')
 const password=$('password').value
 if(!$('passwordField').hidden&&password.length<8)return show('A senha precisa ter pelo menos 8 caracteres.')
 let email=null
 if(!$('emailField').hidden&&!(email=validEmail()))return
 $('submit').disabled=true
 try{
  if(mode==='login'){await login(email,password);goNext()}
  else if(mode==='signup'){
   const user=await signup(email,password,{full_name:$('name').value.trim()})
   if(user.emailVerified)goNext()
   else{setMode('login');show('Conta criada. Confirme pelo link enviado ao seu e-mail e depois entre.',true)}
  }
  else if(mode==='forgot'){await requestPasswordRecovery(email);setMode('login');show('Se o e-mail estiver cadastrado, você receberá um link para redefinir a senha.',true)}
  else if(mode==='reset'){await updateUser({password});goNext()}
  else if(mode==='invite'){
   const user=await acceptInvite(inviteToken,password)
   if(!ALLOWED_DOMAIN.test(user.email||'')){await logout();setMode('login');show('Acesso permitido somente para e-mails @seidor.com.');return}
   goNext()
  }
 }catch(error){show(authMessage(error))}
 finally{$('submit').disabled=false}
}

async function init(){
 setMode('login')
 try{
  const result=await handleAuthCallback()
  if(result?.type==='recovery'){setMode('reset');return}
  if(result?.type==='invite'){inviteToken=result.token;setMode('invite');return}
 }catch(error){show(authMessage(error))}
 const user=await getUser()
 if(!user)return
 if(!ALLOWED_DOMAIN.test(user.email||'')){await logout();show('Acesso permitido somente para e-mails @seidor.com.');return}
 // Evita loop caso a sessão do navegador exista mas o servidor a recuse (ex.: sessão expirada).
 if(Date.now()-Number(sessionStorage.getItem('authRedirectAt')||0)<10000){await logout();show('Sua sessão expirou. Entre novamente.');return}
 await refreshSession()
 goNext()
}
init()
</script></body></html>
